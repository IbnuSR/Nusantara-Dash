name: nusantara_dash
description: "Nusantara Dash - 2D Runner Edutainment Budaya Indonesia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.35.1
  shared_preferences: ^2.5.5
  # audioplayers: ^5.2.1  # Comment dulu, nanti ditambah kalau build stabil

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/player/
    - assets/images/backgrounds/
    - assets/images/obstacles/
    - assets/images/items/
    - assets/images/ui/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/data/quiz_data.json