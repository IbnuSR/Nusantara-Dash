name: nusantara_dash
description: "Nusantara Dash - 2D Runner Edutainment Budaya Indonesia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # 🎮 Game Engine
  flame: ^1.35.1
  
  # 💾 Save Data Lokal (progres pulau, kunci, koin, status prologue)
  shared_preferences: ^2.5.5
  
  # 🎬 Video Player (untuk cutscene & prologue)
  video_player: ^2.8.1

  # 🎵 Audio (BGM & SFX)
  audioplayers: ^6.1.0
  
  # 🔤 Font (untuk pixel font game)
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    # 👤 Player sprites
    - assets/images/player/
    
    # 👹 Boss sprites
    - assets/images/boss/final/
    - assets/images/boss/mini/
    
    # 🎬 Video cutscene & prologue
    - assets/videos/
    
    # 🎵 Background Music
    - assets/audio/bgm/

    # 🏞️ Background pulau
    - assets/images/background/
    
    # 🚧 Obstacles (rintangan)
    - assets/images/obstacles/
    
    # 🎁 Items (koin, kunci, nyawa, clue)
    - assets/images/items/
    
    # ⚔️ Weapons (senjata karakter)
    - assets/images/weapons/
    
    # 🖼️ UI (tombol, icon, background menu)
    - assets/images/ui/

    
    # 📊 Data JSON (kuis, provinsi, senjata)
    - assets/data/quiz_data.json
    - assets/data/province_config.json
    - assets/data/weapon_data.json