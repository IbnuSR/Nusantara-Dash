name: nusantara_dash
description: "Nusantara Dash - 2D Runner Edutainment Budaya Indonesia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.0
  shared_preferences: ^2.5.5
  video_player: ^2.8.1
  audioplayers: ^6.1.0
  google_fonts: ^6.1.0
  flame_audio: ^2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.2"

flutter:
  uses-material-design: true
  
  # ✅ PERBAIKAN: Path asset KONSISTEN dengan lokasi fisik
